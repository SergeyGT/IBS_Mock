spring:
  application:
    name: microcredit-processing-stub
  datasource:
    url: jdbc:h2:mem:processingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

processing:
  delete-delay-seconds: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never

logging:
  file:
    name: processing-stub.log
  level:
    root: INFO
    com.example.demo: INFO
